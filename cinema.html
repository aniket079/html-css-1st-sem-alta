<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <table border="1" cellpadding="10" cellspacing="0">
    <!-- Row 1: Merged Title Banner -->
    <tr bgcolor="#d4edda">
        <th colspan="3">IMAX LUXURY CINEMA - SCREENING HALL 1</th>
    </tr>
    <!-- Row 2: Standard Headers -->
    <tr bgcolor="#e2e3e5">
        <th>Movie Title</th>
        <th>Showtime</th>
        <th>Screen Number</th>
    </tr>
    <!-- Row 3: First row of Avengers (vertical span begins) -->
    <tr>
        <td rowspan="2" bgcolor="#f8d7da"><b>Marvel's Avengers</b></td>
        <td>2:00 PM</td>
        <td>Screen A</td>
    </tr>
    <!-- Row 4: Second row of Avengers (Omit the movie title cell!) -->
    <tr>
        <td>6:00 PM</td>
        <td>Screen A</td>
    </tr>
    <!-- Row 5: Normal Row -->
    <tr>
        <td>Spider-Man</td>
        <td>4:00 PM</td>
        <td>Screen B</td>
    </tr>
</table>
</body>
</html>
